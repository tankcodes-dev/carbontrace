name: Deploy to Staging

on:
    push:
        branches: -"staging"

jobs:
    redploy_everything:
        runs-on: ubuntu-latest
        name: Deploying to staging server

        steps:
            name: SSH into staging server
            run: |
                ssh -i ${{secrets.SSH_PRIVATE_KEY}} ubuntu@${{secrets.STAGING_SERVER_IP}}
                cd carbontrace
                git pull origin staging
                pnpm install
                pnpm build
                pm2 restart 0
                pm2 restart 1
                pm2 restart 2
